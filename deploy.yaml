apiVersion: v1
kind: Namespace
metadata:
  name: geogo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geogo
  namespace: geogo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geogo
  template:
    metadata:
      labels:
        app: geogo
    spec:
      containers:
        - name: geogo
          image: pedromol/geogo:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: geogo
  namespace: geogo
spec:
  type: ClusterIP
  selector:
    app: geogo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: geogo-deny-egress
  namespace: geogo
spec:
  podSelector:
    matchLabels:
      app: geogo
  policyTypes:
    - Egress
  egress: []
